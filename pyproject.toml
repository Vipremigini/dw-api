[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepwriting"
version = "1.0.0"
description = "DeepWriting: Deep Generative Handwriting Synthesis & Digital Ink Editing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tensorflow>=2.15.0",
    "scipy>=1.2.1",
    "numpy<2.0.0",
    "matplotlib>=3.2.0",
    "svgwrite>=1.4.0",
    "scikit-learn>=0.23.0",
    "opencv-python>=4.8.0",
    "Pillow>=9.0.0",
    "imageio>=2.30.0",
]
